[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lite"
version = "0.1.0"
description = "A lightweight, minimal AI agent framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "JuliaHZhu", email = "007WorkLab"}
]
keywords = ["ai", "agent", "llm", "tools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "croniter>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: integration tests that require a live LLM API or external service",
    "slow: tests that take more than 5 seconds",
]

[project.scripts]
hermes-lite = "main:main"

[project.urls]
Homepage = "https://github.com/JuliaHZhu/hermes-lite"
Repository = "https://github.com/JuliaHZhu/hermes-lite"
