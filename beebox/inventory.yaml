# BeeBox 服务器清单
# 复制此文件为 inventory.private.yaml 并填入你的实际服务器信息
# inventory.private.yaml 已加入 .gitignore，不会提交到 Git

# ── SSH 全局配置 ──
ssh:
  user: "ubuntu"
  key_file: "~/.ssh/id_rsa"
  # 如需密码认证，改为 password: "your-password"
  # 注意：密码认证不推荐用于生产环境
  port: 22

# ── NATS 集群节点（所有 bee 共享的通信总线）──
# 第一个节点通常作为 seed
nats_nodes:
  - host: "10.0.1.10"
    name: "nats-1"
  - host: "10.0.1.11"
    name: "nats-2"
  - host: "10.0.1.12"
    name: "nats-3"

# ── Bee 角色部署映射 ──
# 每台服务器部署一个或多个 Bee 角色
# 对齐 design_notes/07-full-agent-ecosystem.md 十步流程
servers:
  # ── Aristotle Bee ──
  - host: "10.0.1.10"
    name: "beebox-aristotle"
    roles:
      - aristotle
    nats_server: true
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"

  # ── Skeleton Bee ──
  - host: "10.0.1.11"
    name: "beebox-skeleton"
    roles:
      - skeleton
    nats_server: false
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ── Strategy Bee ──
  - host: "10.0.1.12"
    name: "beebox-strategy"
    roles:
      - strategy
    nats_server: false
    env:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"

  # ── PM Bee ──
  - host: "10.0.1.13"
    name: "beebox-pm"
    roles:
      - pm
    nats_server: false
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ── Centurion Bee ──
  - host: "10.0.1.14"
    name: "beebox-centurion"
    roles:
      - centurion
    nats_server: false
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ── World Bee ──
  - host: "10.0.1.15"
    name: "beebox-world"
    roles:
      - world
    nats_server: false
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ── Cardmaster Bee ──
  - host: "10.0.1.16"
    name: "beebox-cardmaster"
    roles:
      - cardmaster
    nats_server: false
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ── Newspaper demo ──
  - host: "10.0.1.17"
    name: "beebox-newspaper"
    roles:
      - newspaper
    nats_server: false
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
