# worker-bee 主配置 — 每台机器独立一份，根据角色修改
role: seed           # 当前角色：seed | strategy | pm | centurion | world | aristotle | skeleton | cardmaster
bee_id: auto         # 自动生成 UUID，或手动指定（如 "centurion-east-1"）
nats_url: "nats://localhost:4222"

# NATS 认证（建议所节点统一，防止未授权访问）
nats_auth:
  user: ""           # 与 nats-server.conf 的 authorization 对应
  password: ""

# Gateway 配置（通常只在 PM/堡垒机开启，对外提供 Feishu Webhook 回调）
gateway:
  enabled: false
  platforms:
    feishu:
      enabled: false
      port: 8081
      host: "0.0.0.0"
      extra:
        verification_token: ""   # Feishu 事件订阅校验 token
        app_id: ""               # 发消息所需 App ID（可从环境变量 FEISHU_APP_ID 覆盖）
        app_secret: ""           # 发消息所需 App Secret（可从环境变量 FEISHU_APP_SECRET 覆盖）

# 改装状态
evolution:
  stage: seed              # seed | observing | evolving | evolved
  tasks_completed: 0       # 完成的任务计数
  task_types: {}           # 任务类型统计（如 {"dispatch": 5, "verify": 3}）
  evolve_threshold: 10     # 连续做同一类任务超过此次数 → 建议演化
  evolved_at: null         # 改装完成时间
  evolved_to: null         # 改装成的角色

# skill 仓库
skills_repo: "https://github.com/JuliaHZhu/skills.git"
skills_branch: main
