# BeeBox 角色定义 —— 8 种 Bee 对齐 design_notes/07-full-agent-ecosystem.md
# worker-bee 是共享基础设施，不是角色；各 Bee repo 通过 import worker_bee 构建

bees:
  - role: aristotle
    repo: "https://github.com/JuliaHZhu/aristotle-bee.git"
    branch: main
    description: "术语管家 — 三层解析器（本体/修辞阐释/信念承重墙），第 1 步"
    default_skills:
      - dict-query
      - term-drift-detection

  - role: skeleton
    repo: "https://github.com/JuliaHZhu/skeleton-bee.git"
    branch: main
    description: "骨架蜂 — 规约到不能规约，选牌型 + 定结构，第 2 步"
    default_skills:
      - structure-reduce
      - card-type-select

  - role: strategy
    repo: "https://github.com/JuliaHZhu/strategy-bee.git"
    branch: main
    description: "二级战略层 — 搜索方向 + 战役报告 + 扬弃（第 1/2/9 步）"
    default_skills:
      - boundary-define
      - dialectics-negation
      - campaign-report

  - role: pm
    repo: "https://github.com/JuliaHZhu/pm-bee.git"
    branch: main
    description: "项目/战役管理层 — 排期/拆分/监听汇总结案 + 容灾（第 3/4/6 步）"
    default_skills:
      - plan-decompose
      - schedule-optimize
      - checkpoint-monitor

  - role: centurion
    repo: "https://github.com/JuliaHZhu/centurion-bee.git"
    branch: main
    description: "百夫长 — 监工不干活，一机盯十个 Worker（第 4/5/7 步）"
    default_skills:
      - task-dispatch
      - worker-monitor
      - timeout-handler

  - role: world
    repo: "https://github.com/JuliaHZhu/world-bee.git"
    branch: main
    description: "真实校验 + 运维知识库 — 实时校验 + 复盘归档（第 5/7/8 步）"
    default_skills:
      - fact-check
      - evidence-chain
      - review-archive

  - role: cardmaster
    repo: "https://github.com/JuliaHZhu/cardmaster-bee.git"
    branch: main
    description: "战术本 + 参谋长 — 回合制选动作 + 博弈复盘（第 10 步）"
    default_skills:
      - tactical-playbook
      - adversarial-review
      - action-evaluation

  - role: newspaper
    repo: "https://github.com/JuliaHZhu/newspaper.git"
    branch: main
    description: "模拟报社工作室 swarm demo"
    default_skills:
      - task-ball-machine

# 独立的 Skills 仓库
skills_repo:
  url: "https://github.com/JuliaHZhu/skills.git"
  branch: main
  local_path: "skills"

# NATS 集群配置
nats:
  cluster_name: "beebox-cluster"
  port: 4222
  cluster_port: 6222
  http_port: 8222
  # 各节点 IP 在 inventory.yaml 中定义，此处仅保留模板变量

# 日志收集配置
logs:
  remote_log_dir: "~/.beebox/logs"
  local_collect_dir: "./collected-logs"
  retention_days: 30
