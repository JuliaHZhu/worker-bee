# BeeBox 服务器清单
# 复制此文件为 inventory.private.yaml 并填入你的实际服务器信息
# inventory.private.yaml 已加入 .gitignore，不会提交到 Git

# ── SSH 全局配置 ──
ssh:
  user: "ubuntu"
  key_file: "~/.ssh/id_rsa"
  # 如需密码认证，改为 password: "your-password"
  # 注意：密码认证不推荐用于生产环境
  port: 22

# ── NATS 集群节点（所有 bee 共享的通信总线）──
# 第一个节点通常作为 seed
nats_nodes:
  - host: "10.0.1.10"
    name: "nats-1"
  - host: "10.0.1.11"
    name: "nats-2"
  - host: "10.0.1.12"
    name: "nats-3"

# ── Bee 角色部署映射 ──
# 每台服务器可以部署一个或多个 bee 角色
# 建议：commander 单独一台，worker/world/writer 可按需分配
servers:
  # ── 指挥官节点 ──
  - host: "10.0.1.10"
    name: "beebox-commander"
    roles:
      - commander
    # commander 是否也跑 NATS
    nats_server: true
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"

  # ── Worker 节点 1 ──
  - host: "10.0.1.11"
    name: "beebox-worker-1"
    roles:
      - worker
      - hermes
    nats_server: true
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ── Worker 节点 2 ──
  - host: "10.0.1.12"
    name: "beebox-worker-2"
    roles:
      - worker
      - openclaw
    nats_server: true
    env:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"

  # ── World + Writer 节点 ──
  - host: "10.0.1.13"
    name: "beebox-creative"
    roles:
      - world
      - writer
    nats_server: false
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ── Newspaper 节点 ──
  - host: "10.0.1.14"
    name: "beebox-newspaper"
    roles:
      - newspaper
    nats_server: false
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
