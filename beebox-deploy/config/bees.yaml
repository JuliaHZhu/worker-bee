# BeeBox 角色定义 —— 每个 bee 对应一个 GitHub 仓库
# 修改此文件以添加新的 bee 角色

bees:
  - role: commander
    repo: "https://github.com/JuliaHZhu/commander-bee.git"
    branch: main
    description: "任务分发与指挥官 Agent"
    default_skills: []
    # Commander 通常单独部署，不与其他 bee 混跑

  - role: worker
    repo: "https://github.com/JuliaHZhu/worker-bee.git"
    branch: main
    description: "最小独立 Worker Agent"
    default_skills:
      - productivity
      - research

  - role: world
    repo: "https://github.com/JuliaHZhu/world-bee.git"
    branch: main
    description: "环境即 Agent（WorldBee）"
    default_skills:
      - collection-split

  - role: writer
    repo: "https://github.com/JuliaHZhu/writer-bee.git"
    branch: main
    description: "写作 Agent（WriterBee）"
    default_skills:
      - novel-split
      - novel-tag
      - style-analyzer

  - role: hermes
    repo: "https://github.com/JuliaHZhu/hermes-lite.git"
    branch: main
    description: "轻量消息传递 Agent"
    default_skills: []

  - role: openclaw
    repo: "https://github.com/JuliaHZhu/openclaw-lite.git"
    branch: main
    description: "轻量工具调用 Agent"
    default_skills: []

  - role: newspaper
    repo: "https://github.com/JuliaHZhu/newspaper.git"
    branch: main
    description: "模拟报社工作室"
    default_skills:
      - task-ball-machine

# 独立的 Skills 仓库
skills_repo:
  url: "https://github.com/JuliaHZhu/skills.git"
  branch: main
  local_path: "skills"

# NATS 集群配置
nats:
  cluster_name: "beebox-cluster"
  port: 4222
  cluster_port: 6222
  http_port: 8222
  # 各节点 IP 在 inventory.yaml 中定义，此处仅保留模板变量

# 日志收集配置
logs:
  remote_log_dir: "~/.beebox/logs"
  local_collect_dir: "./collected-logs"
  retention_days: 30
